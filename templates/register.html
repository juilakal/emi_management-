{% extends "base.html" %}

{% block title %}Create Account - EMI Management{% endblock %}

{% block public_content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <h3 class="fw-bold mb-1">Create account</h3>
            <p class="text-muted mb-4">Register to track your loans and EMIs.</p>

            <form action="{{ url_for('auth.register') }}" method="POST" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label for="full_name" class="form-label">Full name</label>
                    <input type="text" class="form-control" id="full_name" name="full_name"
                           value="{{ full_name or '' }}" placeholder="Your name" required autofocus>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email"
                           value="{{ email or '' }}" placeholder="you@example.com" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="At least 6 characters" required>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label">Confirm password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                           placeholder="Type password again" required>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 mb-3">Create account</button>
            </form>

            <p class="text-muted small mb-0">
                Already registered?
                <a href="{{ url_for('auth.login') }}">Sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
