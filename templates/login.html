{% extends "base.html" %}

{% block title %}Sign In - EMI Management{% endblock %}

{% block public_content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <h3 class="fw-bold mb-1">Sign in</h3>
            <p class="text-muted mb-4">Use your email and password to continue.</p>

            <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email"
                           value="{{ email or '' }}" placeholder="you@example.com" required autofocus>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Your password" required>
                </div>

                <button type="submit" class="btn btn-primary-custom w-100 mb-3">Sign in</button>
            </form>

            <p class="text-muted small mb-0">
                New here?
                <a href="{{ url_for('auth.register') }}">Create an account</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
