{% extends "base.html" %}

{% block title %}Sign In - EMI Management System{% endblock %}

{% block public_content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white text-center py-4">
                    <div class="stat-icon-wrapper icon-blue mx-auto mb-2" style="width: 54px; height: 54px;">
                        <i class="bi bi-shield-lock-fill fs-3 text-primary"></i>
                    </div>
                    <h4 class="fw-bold mb-1">Welcome Back</h4>
                    <p class="text-secondary small mb-0">Sign in to access your EMI portal</p>
                </div>
                <div class="card-body p-4 p-md-5 bg-white">
                    <form action="{{ url_for('auth.login', next=request.args.get('next')) }}" method="POST" novalidate>
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" 
                                       value="{{ email or '' }}" placeholder="user@example.com" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" 
                                       placeholder="Enter your password" required>
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary-custom btn-lg">
                                <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
                            </button>
                        </div>
                    </form>

                    <div class="text-center pt-3 border-top">
                        <span class="text-muted small">Don't have an account yet?</span>
                        <a href="{{ url_for('auth.register') }}" class="fw-semibold text-primary ms-1 small">Create an account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
